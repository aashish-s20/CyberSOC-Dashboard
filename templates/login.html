{% extends 'base.html' %}

{% block title %}Login - CyberSOC Dashboard{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 animate-fade-in">
            <div class="text-center mb-4">
                <a href="{{ url_for('main.landing') }}" class="text-decoration-none">
                    <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
                    <h1 class="h3 fw-bold text-white mt-2 brand-font">CyberSOC Portal</h1>
                </a>
            </div>
            
            <div class="card bg-dark-card p-4 p-sm-5 rounded-4">
                <h2 class="h4 fw-bold text-white mb-3 text-center">Authentication Required</h2>
                <p class="text-muted text-center small mb-4">Provide your SOC credentials to access the console</p>
                
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small fw-medium">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary bg-opacity-20 border-white border-opacity-10 text-muted">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g., manager" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary bg-opacity-20 border-white border-opacity-10 text-muted">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>
                
                <div class="text-center mt-3 pt-3 border-top border-white border-opacity-5">
                    <p class="mb-0 text-secondary small">
                        New analyst? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-medium">Register Account</a>
                    </p>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('main.landing') }}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Landing Page
                </a>
            </div>
        </div>
    </div>
{% endblock %}
