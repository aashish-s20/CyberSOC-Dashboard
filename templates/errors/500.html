{% extends 'base.html' %}

{% block title %}500 Internal Server Error - CyberSOC Dashboard{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-75 text-center">
    <div class="error-container p-5 rounded-4 border border-warning border-opacity-25 bg-dark-card shadow-lg animate-fade-in" style="max-width: 500px;">
        <div class="error-icon text-warning mb-4">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-4 fw-bold text-warning mb-2">500</h1>
        <h2 class="h4 text-light mb-3">Internal Crash</h2>
        <p class="text-secondary mb-4">
            An unexpected error occurred. The SOC server encountered a failure while processing your request. Please try again later.
        </p>
        <a href="{{ url_for('main.dashboard' if current_user.is_authenticated else 'main.landing') }}" class="btn btn-outline-primary px-4 py-2">
            <i class="bi bi-arrow-left-short"></i> Back to Safety
        </a>
    </div>
</div>
{% endblock %}
