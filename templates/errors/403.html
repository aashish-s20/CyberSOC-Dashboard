{% extends 'base.html' %}

{% block title %}403 Forbidden - CyberSOC Dashboard{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-75 text-center">
    <div class="error-container p-5 rounded-4 border border-danger border-opacity-25 bg-dark-card shadow-lg animate-fade-in" style="max-width: 500px;">
        <div class="error-icon text-danger mb-4">
            <i class="bi bi-shield-slash-fill" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger mb-2">403</h1>
        <h2 class="h4 text-light mb-3">Access Denied</h2>
        <p class="text-secondary mb-4">
            You do not have the required permissions to view this resource. Please contact your SOC Manager if you believe this is an error.
        </p>
        <a href="{{ url_for('main.dashboard' if current_user.is_authenticated else 'main.landing') }}" class="btn btn-outline-primary px-4 py-2">
            <i class="bi bi-arrow-left-short"></i> Back to Safety
        </a>
    </div>
</div>
{% endblock %}
